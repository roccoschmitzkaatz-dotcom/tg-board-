<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG Board — Schüler-Austausch</title>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --card2:#f7f9fc; --ink:#141d2b; --muted:#5c6a82; --faint:#93a0b5;
    --line:#e2e8f1; --accent:#4f6ef7; --accent-ink:#3a56d4; --teal:#12b3a6; --amber:#f0961e;
    --s11:#4f6ef7; --s12:#12b3a6; --s13:#f0961e;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --shadow:0 1px 2px rgba(20,29,43,.04),0 8px 24px rgba(20,29,43,.06);
    --shadow-lift:0 2px 6px rgba(20,29,43,.06),0 14px 34px rgba(20,29,43,.10);
    --pos:#1a9e6b; --neg:#e0455a;
    --r:14px; --r-sm:10px;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0c1220; --card:#141d2c; --card2:#101827; --ink:#ffffff; --muted:#c2ccdb; --faint:#93a0b5;
    --line:#233043; --accent:#5f7cff; --accent-ink:#9db0ff; --s11:#5f7cff; --s12:#2dd4bf; --s13:#f5a623;
    --shadow:0 8px 28px rgba(0,0,0,.4); --shadow-lift:0 12px 40px rgba(0,0,0,.5);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 80px}
  .badge{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;margin-bottom:10px;letter-spacing:.02em}
  h1,h2{margin:0 0 10px;letter-spacing:-.015em}
  h2{font-size:16.5px;font-weight:680}
  .row{display:flex;align-items:center;gap:10px}
  .row.between{justify-content:space-between}
  .grid{display:grid;gap:11px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
  .btn{font:600 13.5px/1 var(--sans);padding:11px 17px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(79,110,247,.25);transition:filter .12s,transform .08s,box-shadow .12s}
  .btn:hover{filter:brightness(1.06);box-shadow:0 4px 12px rgba(79,110,247,.3)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--accent);background:transparent}
  .loading,.empty,.error{padding:20px;text-align:center;color:var(--muted);font-size:13.5px}
  .error{color:var(--neg)}

  /* --- Auth --- */
  .auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lift);padding:30px 28px;width:100%;max-width:370px}
  .auth-brand{font-weight:740;font-size:20px;margin-bottom:6px;display:flex;align-items:center;gap:9px;letter-spacing:-.02em}
  .auth-brand .mk{background:linear-gradient(135deg,var(--accent),var(--teal));color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px}
  .auth-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .auth-tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:9px;margin-bottom:16px}
  .auth-tab{flex:1;font:600 13px var(--sans);padding:8px;border:none;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
  .auth-tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .auth-form{display:flex;flex-direction:column;gap:12px}
  .auth-form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
  .auth-form input{font:14px var(--sans);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .auth-submit{margin-top:4px}
  .auth-msg{margin-top:12px;font-size:12.5px;min-height:1em}
  .auth-msg.ok{color:var(--pos)}
  .auth-msg.err{color:var(--neg)}

  /* --- App shell --- */
  .app-top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
  .who{display:flex;align-items:center;gap:8px;font-size:14px}
  .who .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .who-btn{background:none;border:1px solid transparent;border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--ink);font:inherit}
  .who-btn:hover{border-color:var(--line);background:var(--card2)}
  .role{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .role-lehrer,.role-sekretariat,.role-admin{color:var(--accent-ink);border-color:var(--accent)}
  .mini-role{font-family:var(--mono);font-size:10px;color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:1px 7px;margin-left:4px}
  .post-staff{background:var(--card2);border-radius:8px;padding-left:10px;padding-right:10px;margin:0 -10px}

  /* --- Profil --- */
  .profile-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:14px;max-width:420px}
  .profile-card label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
  .profile-card input[type="text"]{font:14px var(--sans);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .p-check{flex-direction:row !important;align-items:center;gap:8px !important}
  .p-colors-label{font-size:12.5px;color:var(--muted)}
  .p-colors{display:flex;gap:8px}
  .p-color{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .p-color.on{border-color:var(--ink)}

  /* --- Forum nav --- */
  .forum-nav{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:14px}
  .forum-nav button{background:none;border:none;color:var(--accent-ink);cursor:pointer;font:inherit;padding:0}
  .forum-nav .sep{margin:0 4px}
  .stufe-card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 18px;text-align:center;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s}
  .stufe-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--sc,var(--accent))}
  .stufe-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--sc,var(--accent)) 40%,var(--line))}
  .stufe-card .big{font-size:30px;font-weight:760;color:var(--sc,var(--ink));letter-spacing:-.02em}
  .stufe-card .lbl{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
  .subject-card{position:relative;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:13px 15px 13px 16px;text-align:left;cursor:pointer;font:640 14px var(--sans);color:var(--ink);transition:transform .12s,box-shadow .12s,border-color .12s}
  .subject-card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--sc)}
  .subject-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
  .subject-card .ic{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}

  /* --- Thread list --- */
  .list-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
  .list-toolbar input[type="search"]{flex:1;min-width:180px;font:13.5px var(--sans);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .sort-btns{display:flex;gap:5px;flex-wrap:wrap}
  .sort-btn{font:600 11.5px var(--mono);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
  .sort-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  #new-thread-form{display:flex;gap:8px;margin:10px 0 16px}
  #new-thread-form input{flex:1;font:14px var(--sans);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .thread-row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:9px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .1s,box-shadow .12s,border-color .12s}
  .thread-row:hover{transform:translateX(2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .thread-row .tt{font-weight:640;font-size:14.5px}
  .thread-row .sub{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px}
  .solved{color:var(--pos);font-weight:700;background:color-mix(in srgb,var(--pos) 14%,transparent);border-radius:999px;padding:1px 8px;font-size:11.5px}

  /* --- Thread detail --- */
  .thread-title{font-size:19px;margin-bottom:10px}
  .post-row{border-bottom:1px solid var(--line);padding:12px 0}
  .post-row .ph{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .post-row .you{color:var(--accent-ink);font-weight:600}
  .post-row .when{margin-left:auto;font-family:var(--mono);font-size:11px}
  .post-row .bd{margin-top:5px;font-size:14px}
  .reply-box{margin-top:16px}
  .reply-box textarea{width:100%;font:14px var(--sans);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink);resize:vertical}
  .reply-box .btn{margin-top:8px}

  /* --- Mobile-Feinschliff --- */
  @media(max-width:560px){
    .wrap{padding:18px 14px 60px}
    .app-top{flex-wrap:wrap;gap:8px}
    .row.between{flex-wrap:wrap;gap:8px}
    .row.between .btn{width:100%}
    #new-thread-form{flex-direction:column}
    #new-thread-form .btn{width:100%}
    .thread-row .sub{flex-direction:column;gap:2px}
    .post-row .when{margin-left:0}
    .post-row .ph{flex-wrap:wrap;gap:5px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge" id="mode-badge"></div>
    <div id="app-root"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
